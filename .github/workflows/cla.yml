name: "Contributor License Agreement (CLA)"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: cla-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'docs/signatures/version1/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'bot*,'
          custom-notsigned-prcomment: 'Thank you for your pull request! Before we can accept your contribution, you must read and agree to the [Lipika Contributor License Agreement (CLA)](https://github.com/${{ github.repository }}/blob/main/CLA.md).<br/>To sign the agreement, please reply to this comment with:<br/>`I have read the CLA Document and I hereby sign the CLA`'

