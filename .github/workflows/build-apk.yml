name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK & AAB Bundle
        run: ./gradlew assembleDebug bundleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Dynamic Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Building release for Lipika version: $VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.apk"
          if [ -f app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp app/build/outputs/bundle/debug/app-debug.aab "dist/Lipika v${VERSION_NAME}.aab"
          fi
          ls -la dist/

      - name: Upload Debug APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-Release-Packages
          path: dist/*

      - name: Release Lipika APK & AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **🖼️ Official App Icon Artwork**:
              - Restored the high-resolution light background canvas artwork with diagonal gradient, soft shadows, and centered vibrant blue-cyan squircle "L" badge across all screen densities.
            - **⌨️ Keyboard Layout & Symbol Hints (Exact Reference Match)**:
              - Dedicated English Number Row with Bengali numeral hints (`১`–`০`), and dedicated Bengali Number Row with English numeral hints (`1`–`0`).
              - Standard QWERTY layout symbol hints (`q`→`৳`, `w`→`%`, `e`→`_`, `r`→`;`, `t`→`<`, `y`→`>`, `u`→`+`, `i`→`=`, `o`→`[`, `p`→`]`).
              - Bottom row arranged as: `?123 / ?১২৩`, `Emoji`, `/`, `Spacebar`, `. / ।`, `Go / Enter`.
              - Symbols layout 1 and 2 updated with exact glyphs (`☞ ◐ ⊕ ✖ ✔ ✪ ∞ ⇒ ➤ ✆`, etc.).
            - **✨ Bengali Unicode & Provat Engine Refinement**:
              - Eliminated HarfBuzz dotted circle (`◌`) artifacts at the Unicode level with smart vowel kar merging, independent vowel resolution, and duplicate hasanta prevention.
            - **🔊 Dedicated Sound & Vibration Settings**:
              - Added dedicated Sound & Vibration settings section with volume slider, vibration mode (Haptic vs Vibration), intensity, and duration controls.
              - Configured `VibrationAttributes.USAGE_TOUCH` and `AudioAttributes.USAGE_ASSISTANCE_SONIFICATION` for guaranteed keypress sound and vibration feedback on all OEM Android devices.
            - **🔤 Dual Font System & 10 New Fonts**:
              - Choose English and Bengali typography simultaneously with dedicated preview sentences.
              - Added 5 new Bengali fonts: **SolaimanLipi**, **Siyam Rupali**, **Noto Sans Bengali**, **Hind Siliguri**, **AponaLohit**.
              - Added 5 new English fonts: **Roboto**, **Inter**, **Poppins**, **Outfit**, **Montserrat**.
              - Added dedicated **Fonts** shortcut directly on the keyboard toolbar.
            - **⚡ Performance & Latency Optimization**:
              - Ultra-responsive touch handling preventing missed keypresses during rapid multi-touch typing.
              - Spacebar swipe threshold reduced to 28dp for instant language switching.
            - **🎨 Appearance & Theme Polish**:
              - Streamlined Appearance screen without unnecessary live previews.
              - Added "System Default" to automated theme schedule.
              - Removed description line limits to eliminate truncated text.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
