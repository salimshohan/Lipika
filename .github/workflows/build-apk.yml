name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release
            
            - **⌨️ Complete First Symbol Layout (`?123`) & Extended Symbols (`=<`)**:
              - **First Symbol Layout (`?123`)**: Row 0 dedicated numbers with Bengali numeral hints; Row 1 `⇥` Tab, `~`, `\` (with `/` hint), `<`, `>`, `_`, `=`, `[`, `]`; Row 2 `@`, `#`, `৳`, `%`, `&`, `*`, `-`, `+`, `(`, `)`; Row 3 `=<`, `!`, `"`, `'`, `:`, `;`, `/`, `?`, Backspace; Row 4 `ABC`, `,`, Spacebar (5.0f), `.`, `Go`.
              - **Extended Symbols Layout (`=<`)**: Row 0 `👉`, `◐`, `⊕`, `✖`, `✔`, `★`, `∞`, `➡`, `▶`, `🔄`; Row 1 `~`, ``` ` ```, `|`, `৳`, `√`, `π`, `÷`, `×`, `{`, `}`; Row 2 `⇥` Tab, `£`, `$`, `%`, `^`, `°`, `-`, `=`, `[`, `]`; Row 3 `?123`, `✥` Directional / Text-Editing key, `®`, `©`, `™`, `\`, `<`, `>`, Backspace; Row 4 `ABC`, `,`, Spacebar, `.`, `Go`.
            - **🇧🇩 Flawless Bengali Typography & Zero Dotted-Circle Fix**:
              - Fixed Bengali typography rendering where combining vowel signs (কার e.g. "ক" + "া" -> "কা") previously caused Android's text layout engine to insert an unwanted dotted circle placeholder (`◌`).
              - Native direct character commitment for fixed layouts (`bn_probhat`), eliminating isolating composing spans on vowel marks.
              - Dynamic real-time prefix suggestion engine for Bengali Probhat and direct candidate replacement.
              - Automatic sanitation stripping any accidental `\u25CC` placeholder characters.
            - **🎯 Vector Icon Keycaps & Directional Pad Shortcut**:
              - Crisp vector icon rendering for Tab (`⇥`) and Directional (`✥`) keys.
              - Tapping `✥` instantly opens the directional cursor and text-editing panel.
            - **⌨️ Perfected English Keyboard Layout & Bengali Numerals**:
              - Dedicated Number Row (`1`–`0`) displaying Bengali numerals (`১`–`০`) as top-right secondary hints. Normal tap types English numbers; long press inserts the Bengali numeral.
              - Clean `x`, `c`, `v` without visible badge hints, featuring direct Cut, Copy, and Paste long-press actions (Copy captures all text if no selection, or selected text).
              - Standardized bottom row: `?123` ➔ `Emoji` ➔ `Comma (,)` ➔ `Spacebar` ➔ `Full Stop (.)` ➔ `Go / Enter`.
            - **🎨 Dedicated Appearance Section & Symmetrical Dashboard**:
              - Display Mode (Light, Dark, System Default), App Theme (Light, Dark, System, Dynamic Color), Keyboard Theme (Light, Dark, Custom with live interactive preview), Dark Style (Pure Black, AMOLED, Dark Gray), and Scheduling.
              - Modern 4×2 frosted glass dashboard cards with edge-to-edge sunrise artwork.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
