name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Dynamic Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Building release for Lipika version: $VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.apk"
          ls -la dist/

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-Release-Packages
          path: dist/*

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🚀 Lipika Keyboard ${{ github.ref_name }} Release

            - **🎯 Strict Path Subtraction (Path.Op.DIFFERENCE) for Bengali Combining Marks**:
              - Standalone Bengali dependent vowel signs (Kar/Matra: া, ি, ী, ু, ূ, ৃ, ে, ৈ, ো, ৌ), Hasanta (্), and diacritics (ঁ, ং, ঃ) are now rendered via mathematical vector subtraction:
                - Extracts `\u25CC` + mark and `\u25CC` outlines with `paint.getTextPath`.
                - Subtracts the dotted circle via `combinedPath.op(circlePath, Path.Op.DIFFERENCE)` so only pure matra geometry remains.
                - Centers horizontally at `centerX` (`-bounds.centerX() + centerX`) and aligns vertically with `baselineY` with `Paint.Style.FILL`.
              - Applied to primary center key labels, top-right flick-up hints, long-press MoreKeys popups, quick-symbol drag overlays, and keyboard layout previews.
            - **⚡ Lipika Smart Engine Multi-Tap Gestures in Settings**:
              - **Double-Tap**: Instantly toggles between **Dark Mode** and **Light Mode** across the entire app with smooth haptics and toast confirmation.
              - **Triple-Tap**: Instantly switches **App Language** between **বাংলা (Bengali)** and **English** with immediate UI updates.
            - **🔤 Complete Input & Typing Stability**:
              - All character inputs, gestures, and layout commitments are preserved with zero lag and instant responsiveness.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
