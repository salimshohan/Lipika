name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release
            
            - **🌄 Edge-to-Edge Sunrise Dashboard**: Removed top header section completely from the main settings screen; the scenic mountain sunrise artwork now seamlessly extends right from the status bar.
            - **🔤 Dedicated Fonts Screen**: Renamed "Shop" to "Fonts" with typography icon; removed Themes/Font Studio tab switcher; displays each font name with the full sentence preview (`"The quick brown fox jumps over the lazy dog"`).
            - **🌐 Direct Language Cards & Individual Toggles**: Renamed "Customize" to "Language"; English, Provat (`bn_probhat`), and Avro (`bn_avro`) enabled by default; every layout (including all Bangla layouts) features its own dedicated ON/OFF toggle switch and direct layout picture preview.
            - **⚙️ Preferences with Dynamic App Accent**: Renamed "Settings" to "Preferences" with modern tune/sliders icon; Vibrate on keypress is OFF by default; Long-press delay slider now continuously adjustable from 100 ms to 600 ms; added dynamic App Accent Color customization (Cyan, Emerald, Orange, Violet, Rose, Amber).
            - **ℹ️ Comprehensive Technical About Screen**: Renamed "Survey" to "About" with info icon; added extensive architectural & technical keyboard documentation (hybrid zero-latency Rust core, 100% offline privacy, Salim Hosen Shohan, University of Rajshahi).
            - **📋 Persistent Sandboxed Image Clipboard**: Permanent disk storage for image clips with real visual thumbnails in clipboard settings and quick-paste bar.
            - **😀 iOS-Style Emoji Picker & Shortcuts**: Bottom bar emoji key, iOS-style grid preview, and English-exclusive cut/copy/paste keys.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
