name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **🖼️ App Icon Artwork Complete Restoration**:
              - Restored the complete light background canvas artwork with diagonal ambient gradient and soft specular lighting (`media_1793977899450_25297cd4.png`).
              - Centered floating blue-to-cyan decorative squircle badge with soft ambient drop shadow and crisp white capital letter "L" glyph in safe zone across all Android densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`), adaptive launcher drawables, and SVG assets.
            - **🎨 Theme Page Complete Redesign**:
              - Status-bar inset respecting navigation bar with clean back navigation.
              - Prominent **Create Theme** (launches Theme Studio) and **My Themes** management options at the top.
              - Categorized in strict order: **Default Themes** (Default Light, Default Dark), **Color Themes** (solid colors), and **Gradient Themes** (gradient themes).
              - Exactly **TWO** rectangular theme cards per row (`chunked(2)`) with immediate miniature keyboard preview without clicking.
              - Interactive Customization Inspector: Clicking a card previews the theme and provides Key Border and Key Shadow toggles with an "Apply Theme" button.
            - **📁 My Themes Sequential Auto-Naming & Management**:
              - User custom themes automatically sequenced as "Lipika Theme 1", "Lipika Theme 2", etc. (never overwriting existing names).
              - Full lifecycle management: Apply, Preview, Edit in Theme Studio, Rename, Share, and Delete with confirmation.
            - **✨ Dedicated Appearance & Rich Multi-Accent System**:
              - Cleaned up Appearance screen, removing redundant duplicates and integrating high-quality Accent Customization.
              - **Single Color Mode**: 18 curated premium presets (Premium Blue, Royal Blue, Sky Blue, Teal, Mint Green, Emerald, Purple, Lavender, Violet, Pink, Rose, Coral, Orange, Amber, Gold, Red, Neutral Slate, Pastel Cyan) plus custom Hex color input.
              - **Multiple Colors Mode**: Independent accent color customization for Cards, Navigation, Icons, Controls, and Buttons with live preview and reset to defaults.
              - Automated Theme Scheduling (Always Light, Always Dark, Sunset to Sunrise, and Custom Schedule).
            - **⚡ Dashboard Minimal Typing Animation (60+ Variations)**:
              - Over 60 curated Bengali and English text variations with smooth typing, deleting, blinking cursor, and zero layout shift.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
