name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: "Lipika v0.1.5"
          body: |
            ### 🌟 Lipika Keyboard v0.1.5 Release
            
            - **Brand New Smart Home UI**: Redesigned home interface with live typing test area and quick settings.
            - **New Lipika Logo**: Fresh vector app icon and launcher graphics.
            - **Tw Cent MT & Custom Font Support**: 10 font choices plus direct `.ttf` / `.otf` custom font loader.
            - **Curated Layouts**: English, Ovro, Bangla Jatiyo, Provat, and Arabic.
            - **English Clipboard Shortcuts**: Quick Cut (x), Copy (c), and Paste (v) directly on keyboard keys.
            - **Developer**: Salim Hosen Shohan, University of Rajshahi.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
