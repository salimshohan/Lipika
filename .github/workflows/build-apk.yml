name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Dynamic Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Building release for Lipika version: $VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.apk"
          ls -la dist/

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-Release-Packages
          path: dist/*

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **🎨 Pixel-Perfect App Icon & Branding**:
              - Restored elevated vibrant blue-to-cyan squircle badge with 45-degree diagonal cast shadow, sleek diagonal light sheen, and geometric rounded white Lipika "L" glyph on a pure white, zero-border canvas directly matching the approved master artwork.
            - **🎨 "Customize your space" Theme Experience**:
              - Added dedicated theme onboarding step matching the visual reference design with Ocean Teal, Sunset Coral, Minimal Grey, and Soft Lavender.
              - Streamlined Theme Gallery cards with matching typography and visual identity.
            - **📱 Restored v0.3.2 Transparent Status Bar**:
              - Transparent, visible status bar design with dynamic light/dark contrast and automatic Window Insets padding.
            - **🇧🇩 Full In-App Bengali Translation (বাংলা সেটিংস)**:
              - When App Language is set to বাংলা, all text across the dashboard and all sub-screens dynamically translate to clean, natural Bengali.
            - **⚡ Substantial Typing Boost & Zero-Latency Input**:
              - Offloaded dictionary completion queries and candidate generation to a background dispatcher pipeline, eliminating main-thread bottlenecks.
            - **✨ Snappy Spring Bounce Key Animations**:
              - Micro-scale spring bounce animations on keycap touches for satisfying physical tactile feedback.
            - **🛠️ Refined Keyboard Top Toolbar Icons**:
              - Modern outline vector icons with frosted capsule pill tiles and smooth press animations.
            - **😍 High Quality iOS-Style Floating Emoji Preview**:
              - Enlarged high-resolution emoji grid with an iOS-style floating pop-up bubble preview.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
