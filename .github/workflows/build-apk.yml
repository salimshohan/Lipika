name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release
            
            - **🎨 Luminous Aurora Gradient Theme**: Frosted glass gradient aesthetic now set as default.
            - **🔤 Font Studio with 11+ Real Fonts**: Built-in real TTF typography with Tw Cent MT (default), Kalpurush, Segoe UI, Georgia, Consolas, Candara, Comic Sans, Trebuchet MS, Verdana, Calibri, Corbel, and custom font file loader.
            - **✨ Brand New Lipika Logo**: Redesigned modern Bengali 'ল' & neon cyber keycap emblem.
            - **✂️ Direct English Keyboard Shortcuts**: Instant Cut on 'x', Copy on 'c', Paste on 'v', Select All on 'z'.
            - **🌐 Curated 5 Layouts**: English, Provat, Avro Phonetic, Arabic, and Bangla Jatiyo.
            - **📱 All-English Modern Settings UI**: Clean, responsive Material 3 layout with live testing sandbox.
            - **👤 Sole Developer**: Salim Hosen Shohan, University of Rajshahi.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
