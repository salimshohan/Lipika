name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Dynamic Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Building release for Lipika version: $VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.apk"
          ls -la dist/

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-Release-Packages
          path: dist/*

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **🖼️ Official App Icon & Branding**:
              - Restored the exact high-resolution light background canvas artwork with diagonal gradient, soft shadows, and centered vibrant blue-cyan squircle "L" badge across all screen densities.
            - **📊 Real-time Typing Insights & Statistics**:
              - Added dedicated **Typing Insights** dashboard tracking total keystrokes, Bengali letters, English letters, Avro phonetic transliterations, total words, numeric digits, and audio clicks.
              - Includes one-tap reset with confirmation dialog.
            - **🔤 Expanded Typography — 15 Bengali & 15 English Fonts**:
              - Expanded Bengali font collection to 15 fonts (**Kalpurush**, **SolaimanLipi**, **Siyam Rupali**, **Noto Sans Bengali**, **Hind Siliguri**, **AponaLohit**, **Bensen**, **Galada**, **Atma**, **Mina**, **Shonar Bangla**, **Sutonny**, **Charu Chandan**, **Sagar**, **Ador**).
              - Simultaneous selection and independent rendering of English and Bengali fonts with instant live preview.
            - **🔊 Reliable Keypress Audio Click Fix (SoundPool)**:
              - Built a dedicated direct `SoundPool` audio pipeline for system keypress sound effects, guaranteeing audible click feedback on all Android devices regardless of OEM system touch sound toggles.
              - Sound & Vibration controls moved exclusively to the dedicated Sound & Vibration settings screen.
            - **⏱️ Configurable Clipboard Auto-Expiration**:
              - Automatic retention system for clipboard items (1h, 2h, 5h default, 6h, 12h, 1 day, 15 days, 30 days, or Never).
              - Pinned clips are permanently protected from expiration.
            - **⏱️ Key Touch & Timing Full Slider Control (100ms–500ms)**:
              - Added fine-grained slider control for long-press delay from 100ms to 500ms with real-time feedback.
            - **🎨 Appearance Settings Streamline**:
              - Redesigned Appearance screen matching Preferences card design with 10 curated single accents.
              - Removed unnecessary live preview boxes and clutter.
            - **📱 Smart Header & Status Bar Polish**:
              - Eliminated duplicate headers and status bar overlapping across all settings sub-screens.
              - Streamlined card subtitles with single-line truncation and bold 10.5sp typography.
              - Removed Typing Intelligence section from Smart Typing screen.
            - **👤 Direct Developer Contact**:
              - Added clickable developer cards for WhatsApp (`01522106283`) and Facebook (`@salimhosenshohan`) in the About screen.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
