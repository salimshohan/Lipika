name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Dynamic Artifacts
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Building release for Lipika version: $VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Lipika.apk"
          ls -la dist/

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-Release-Packages
          path: dist/*

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **📱 Global Unified Header & Navigation**:
              - Positioned consistently below the status bar using proper Android Window Insets across ALL pages.
              - Highlighted circular back button with accent tint and border for consistent navigation UX everywhere.
            - **🎨 Theme Page Redesign**:
              - Completely redesigned to seamlessly match Lipika's visual identity, typography, cards, and theme colors in both Light & Dark modes.
              - 2-column theme cards with miniature keyboard previews, active theme checkmark indicator, and full custom theme management.
            - **🌈 10 Distinct Vibrant Accent Colors**:
              - Fully updated accent palette with non-overlapping colors across the spectrum: Electric Cyan, Royal Blue, Emerald Green, Neon Lime, Radiant Orange, Golden Amber, Crimson Red, Hot Pink, Vivid Purple, and Indigo Blue.
            - **🔊 Sound & Vibration Expansion**:
              - Added 4 Key Sound Profiles: Modern Crisp, Mechanical Switch, Retro Typewriter, and Soft Bubble.
              - Key-Specific Audio Pitch toggle (distinct pitch for Spacebar, Backspace, and Enter).
              - Added Vibrate on Long-Press and Vibrate on Spacebar Swipe controls.
              - Added interactive "Tap to Test Feedback" card for instant real-time sound and vibration testing in settings.
            - **📈 Advanced Typing Insights**:
              - Added Typist Level Badges (Novice, Rising Wordsmith, Fluent Scribe, Keyboard Artisan, Grandmaster).
              - Bengali vs English Language Ratio progress bar.
              - Typing Accuracy Rate (%) and Estimated Time Saved metrics.
              - Dedicated counters for Backspaces/Edits, Emojis, Symbols, and Numbers.
            - **🖼️ 100% Faithful Branding**:
              - Official Lipika squircle logo integrated into main dashboard and settings headers matching docs/logo.svg.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
