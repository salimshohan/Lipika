name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release
            
            - **⌨️ Perfected English Keyboard Layout & Bengali Numerals**:
              - Dedicated Number Row (`1`–`0`) displaying Bengali numerals (`১`–`০`) as top-right secondary hints. Normal tap types English numbers; long press inserts the Bengali numeral.
              - Alphabet rows with exact secondary symbol hints (`৳`, `%`, `_`, `;`, `<`, `>`, `+`, `=`, `[`, `]`, `@`, `#`, `&`, `*`, `-`, `!`, `?`, `(`, `)`, `"`, `'`, `:`, `/`).
              - Clean `x`, `c`, `v` without visible badge hints, featuring direct Cut, Copy, and Paste long-press actions (Copy captures all text if no selection, or selected text).
              - Standardized bottom row: `?123` ➔ `Emoji` ➔ `Comma (,)` ➔ `Spacebar` ➔ `Full Stop (.)` ➔ `Go / Enter`.
            - **🎨 Dedicated Appearance Section**: Comprehensive appearance controls with Display Mode (Light, Dark, System Default), App Theme (Light, Dark, System, Dynamic Color), Keyboard Theme (Light, Dark, Custom with embedded live interactive preview), Dark Style (Pure Black `#000000`, AMOLED `#18181B`, Dark Gray `#22242B`), and Scheduling (Always Light, Always Dark, Sunset to Sunrise, Custom Schedule with time sliders).
            - **🎛️ Modern 4×2 Symmetrical Dashboard Grid**: Smart Typing, Fonts, Theme, Language, Preferences, Clipboard, Appearance, and About in rectangular frosted glass cards.
            - **⚡ Smart Typing Intelligence**: Consolidated Smart Typing screen with offline bilingual (Bengali & English) emoji predictions and corrections.
            - **🌄 Edge-to-Edge Sunrise Dashboard**: Scenic mountain sunrise artwork seamlessly extending right from the status bar.
            - **🔤 Dedicated Fonts Screen**: Tw Cent MT, Kalpurush, and 11+ fonts with typography preview.
            - **🌐 Multi-Language Layouts & Toggles**: English, Provat, and Avro with direct picture previews and individual toggles.
            - **⚙️ Preferences & Dynamic Accent**: Haptic feedback, adjustable long-press delay (100–600ms), and custom accent palette.
            - **📋 Sandboxed Image Clipboard**: Offline clipboard with image capture and pin support.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
