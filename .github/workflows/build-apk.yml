name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release

            - **🎨 Strict Reference Theme Gallery**:
              - Recreated the Theme Gallery following the exact light, premium glassmorphism aesthetic (`media_1793974527569_3f4713f4.jpg`).
              - Teal squircle header badge (`🎨`) with "Customize your space" and "Choose a theme that feels right for you".
              - Exactly **TWO** rectangular theme cards per row (`chunked(2)`) with rounded corners (`22.dp`), subtle borders, soft shadows, and clean typography.
              - Curated featured themes: **Ocean Teal** (*Fresh & energizing*), **Sunset Coral** (*Warm & creative*), **Minimal Grey** (*Clean & focused*), **Soft lavender** (*Calm & soothing*), alongside Frosted Glass, Lipika Gradient, Default Light/Dark, and AMOLED Black.
              - Miniature keyboard preview on each card with translucent keycap bars, theme gradients, and active checkmark badges.
              - Bottom docked deep forest teal **"Continue"** pill button (`RoundedCornerShape(26.dp)`, `height = 52.dp`).
            - **🖼️ Strict App Icon Artwork**:
              - Replaced all launcher icons to match the exact light squircle reference (`media_1793974513501_9b73af67.png`).
              - Premium soft-blue to cyan gradient background with diagonal faceted lighting and soft ambient drop shadow.
              - Rounded white capital letter "L" glyph centered in safe zone across all Android densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`), adaptive icons, and vector drawables.
            - **⌨️ Complete First Symbol Layout (`?123`) & Extended Symbols (`=<`)**:
              - Row 0 dedicated numbers with Bengali numeral hints; Tab, Directional cursor pad, math symbols, and full punctuation suites.
            - **🇧🇩 Flawless Bengali Typography & Zero Dotted-Circle Fix**:
              - Fixed combining vowel marks (কার) eliminating unwanted dotted circle placeholders (`◌`).
            - **📱 Symmetrical Dashboard & Unified Appearance Settings**:
              - Centralized Appearance section organizing Display Mode, App Theme, Keyboard Theme, Dark Style, and Automated Scheduling.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
