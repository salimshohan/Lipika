name: Build Lipika Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo NDK
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Install Android NDK 26.2.11394342
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lipika.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lipika-APK
          path: dist/Lipika.apk

      - name: Release Lipika APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Lipika ${{ github.ref_name }}"
          body: |
            ### 🌟 Lipika Keyboard ${{ github.ref_name }} Release
            
            - **💎 Official Cyber Bengali Launcher Icon**: Full fidelity conversion of `docs/logo.svg` into Android Adaptive Icons (with safe-zone compliance against circular/squircle masks) and ultra-crisp legacy density mipmaps (`mdpi` through `xxxhdpi`).
            - **🌄 Scenic Mountain Sunset Dashboard**: Modern floating status card with [Lipika Keyboard • Active], quick split Theme/Layout columns, and 6 circular action buttons (Shop, Theme, Customize, Settings, Clipboard, Survey) inspired by modern keyboard dashboards.
            - **🔑 Permanent Debug Keystore**: Fixed Android app update conflict (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`) so updates install seamlessly over existing installations.
            - **🔤 App-Wide Dynamic Typography**: Selecting any font from Font Studio (Tw Cent MT, Kalpurush, Segoe UI, Georgia, Consolas, or custom font) instantly applies to the entire app interface.
            - **😀 Bottom Bar Emoji Key & iOS-Style Emoji Picker**: Language globe icon replaced with Emoji icon on the spacebar row (tap to toggle emoji, long-press to switch language) and spacious iOS-style emoji grid preview.
            - **✂️ English-Exclusive Shortcuts**: Direct Cut (`x`), Copy (`c`), Paste (`v`), and Select All (`z`) strictly active only in the English keyboard layout.
            - **👤 Sole Developer**: Salim Hosen Shohan, University of Rajshahi.
          files: dist/Lipika.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
