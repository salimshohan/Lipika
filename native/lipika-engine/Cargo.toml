[package]
name = "lipika-engine"
version = "0.1.9"
edition = "2021"
authors = ["Salim Hosen Shohan"]
description = "High-performance hybrid spatial Lipika Keyboard core and phonetic engine in pure Rust"

[lib]
name = "borno_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
memmap2 = "0.9.4"
parking_lot = "0.12.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
