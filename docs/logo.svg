<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue to Cyan Gradient -->
    <linearGradient id="lipikaBgGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Faceted Geometric Light Ray -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow for L Glyph -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="14" stdDeviation="12" flood-color="#172554" flood-opacity="0.38" />
    </filter>

    <filter id="iconCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#lipikaBgGrad)" filter="url(#iconCardShadow)" />

  <!-- Diagonal Facet Light Beam -->
  <path d="M 240 44 L 468 44 C 468 90 468 200 468 240 L 300 468 C 240 468 180 468 150 468 Z" fill="url(#facetHighlight)" opacity="0.65" />
  <path d="M 468 120 L 468 360 L 330 468 L 260 468 Z" fill="#000000" opacity="0.06" />

  <!-- The Bold, Friendly Rounded Lipika "L" Glyph -->
  <g filter="url(#glyphShadow)">
    <path d="
      M 246 114
      C 220 114 204 130 204 156
      L 204 306
      C 204 344 232 372 270 372
      L 326 372
      C 344 372 358 358 358 340
      C 358 322 344 308 326 308
      L 274 308
      C 259 308 248 297 248 282
      L 248 156
      C 248 130 246 114 246 114
      Z"
      fill="#FFFFFF" />
  </g>
</svg>
