<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Keycap Body -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Glass Sheen -->
  <path d="M 40 132 C 40 81 81 40 132 40 L 380 40 C 431 40 472 81 472 132 L 472 180 Q 256 120 40 180 Z" fill="url(#sheenGrad)" />

  <!-- Center Radial Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)" />

  <!-- Top Horizontal Bar ('Matra') -->
  <rect x="130" y="160" width="252" height="26" rx="13" fill="#FFFFFF" />

  <!-- Stylized Modern Bengali 'ল' Loops -->
  <path d="M 155 310 C 135 275 145 220 180 196 C 210 176 242 188 252 218 C 265 188 298 176 328 196 C 360 220 370 275 350 310 C 340 330 315 350 280 345 L 280 318 C 300 322 320 310 326 295 C 338 270 330 230 306 215 C 288 202 265 210 256 238 L 242 238 C 233 210 210 202 192 215 C 168 230 160 270 172 295 C 178 310 198 322 218 318 L 218 345 C 183 350 158 330 155 310 Z" fill="url(#glyphGrad)" />

  <!-- Vertical Stem of 'ল' -->
  <rect x="356" y="160" width="26" height="195" rx="13" fill="#FFFFFF" />

  <!-- Foot Accent -->
  <rect x="330" y="340" width="52" height="22" rx="11" fill="#FFFFFF" />

  <!-- Electric Cyan Typing Cursor Spark -->
  <rect x="396" y="170" width="14" height="48" rx="7" fill="#06B6D4" />
</svg>
