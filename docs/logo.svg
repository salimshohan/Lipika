<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue to Electric Cyan Gradient for Central Lipika Squircle -->
    <linearGradient id="lipikaGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#3261BD" />
      <stop offset="35%" stop-color="#3877CE" />
      <stop offset="65%" stop-color="#38A3CC" />
      <stop offset="100%" stop-color="#43B6D1" />
    </linearGradient>

    <!-- Diagonal Translucent Light Sheen -->
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#E0F7FA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#43B6D1" stop-opacity="0" />
    </linearGradient>

    <!-- 45-degree Diagonal Cast Shadow for the "L" Glyph -->
    <linearGradient id="glyphCastShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for the Central Squircle -->
    <clipPath id="squircleClip">
      <rect x="84" y="84" width="344" height="344" rx="86" />
    </clipPath>
  </defs>

  <!-- Solid Pure White Background - Zero Border -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Central Decorative Blue-to-Cyan Squircle Badge -->
  <rect x="84" y="84" width="344" height="344" rx="86" fill="url(#lipikaGrad)" />

  <!-- Elements clipped strictly within the squircle badge -->
  <g clip-path="url(#squircleClip)">
    <!-- Diagonal Facet Light Reflections -->
    <path d="M 210 84 L 428 84 L 428 302 L 302 428 L 180 428 Z" fill="url(#facetGrad)" />

    <!-- 45-Degree Diagonal Cast Shadow from "L" -->
    <path d="
      M 248 186
      L 410 348
      L 348 410
      L 310 348
      L 310 304
      C 290 304 270 304 262 304
      L 248 290
      Z"
      fill="url(#glyphCastShadowGrad)" />

    <!-- Secondary Soft Contact Shadow under "L" base -->
    <path d="
      M 204 314
      C 204 354 244 354 260 354
      L 314 354
      C 328 354 336 346 336 336
      C 336 348 322 360 306 360
      L 254 360
      C 224 360 198 340 198 310
      Z"
      fill="#172554" opacity="0.22" />

    <!-- The Bold, Friendly Rounded Lipika "L" Glyph -->
    <path d="
      M 204 186
      A 22 22 0 0 1 248 186
      L 248 290
      C 248 298 254 304 262 304
      L 310 304
      A 22 22 0 0 1 310 348
      L 248 348
      A 44 44 0 0 1 204 304
      L 204 186
      Z"
      fill="#FFFFFF" />
  </g>
</svg>